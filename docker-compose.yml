services:
  api:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DATA_FILE: /app/data/tasks.json
      SEED: "false"
    volumes:
      - kanban-data:/app/data

  web:
    build:
      context: ./frontend
      args:
        # O navegador do usuário chama a API pelo host, não pela rede do compose.
        VITE_API_URL: http://localhost:8080
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  kanban-data:
