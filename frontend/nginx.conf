server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # SPA de rota única: qualquer caminho cai no index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Os assets do Vite têm hash no nome, então podem ser cacheados por muito tempo.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
